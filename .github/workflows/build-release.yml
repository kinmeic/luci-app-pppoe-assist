name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: OpenWrt ${{ matrix.openwrt_version }} ${{ matrix.package_format }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: 24.10.7
            package_format: ipk
            sdk_name: openwrt-sdk-24.10.7-x86-64_gcc-13.3.0_musl.Linux-x86_64
          - openwrt_version: 25.12.5
            package_format: apk
            sdk_name: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64

    env:
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      PACKAGE_FORMAT: ${{ matrix.package_format }}
      SDK_NAME: ${{ matrix.sdk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev \
            rsync unzip zlib1g-dev file wget jq

      - name: Download OpenWrt SDK
        run: |
          set -eu
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          wget -nv "${base}/${SDK_NAME}.tar.zst"
          # Verify against the official checksum list instead of a hardcoded
          # hash, so version bumps only need OPENWRT_VERSION/SDK_NAME changes.
          wget -nv -O sha256sums "${base}/sha256sums"
          awk -v name="${SDK_NAME}.tar.zst" \
            '$2 == name || $2 == "*" name { print }' sha256sums | sha256sum -c -
          tar --zstd -xf "${SDK_NAME}.tar.zst"
          mv "${SDK_NAME}" sdk

      - name: Prepare package source
        run: |
          set -eu
          mkdir -p sdk/package/pppoe-assist/luci-app-pppoe-assist
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'sdk' \
            --exclude '*.tar.zst' \
            --exclude 'sha256sums' \
            ./ sdk/package/pppoe-assist/luci-app-pppoe-assist/

      - name: Update feeds
        working-directory: sdk
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Build package
        working-directory: sdk
        run: |
          set -eu
          make defconfig
          make package/pppoe-assist/luci-app-pppoe-assist/compile V=s

      - name: Collect artifacts
        run: |
          set -eu
          mkdir -p artifacts
          find sdk/bin/packages -type f \
            -name "luci-app-pppoe-assist_*.${PACKAGE_FORMAT}" \
            -exec cp -v {} artifacts/ \;
          test "$(find artifacts -type f -name "*.${PACKAGE_FORMAT}" | wc -l)" -gt 0

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-pppoe-assist-openwrt-${{ env.OPENWRT_VERSION }}-${{ env.PACKAGE_FORMAT }}-x86_64
          path: artifacts/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: luci-app-pppoe-assist-openwrt-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          notes="OpenWrt x86_64 package builds for ${tag}: IPK for 24.10.7 and APK for 25.12.5."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "$tag" --notes "$notes"
          fi
